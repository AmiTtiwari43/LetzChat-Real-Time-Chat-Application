<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfinityChat | Pro Real-Time Messenger</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Auth Screen -->
    <div id="auth-container" class="login-overlay">
        <div class="login-card" id="login-box">
            <h1>Welcome Back!</h1>
            <p>We're so excited to see you again!</p>
            <form id="login-form">
                <div class="input-group">
                    <label>USERNAME</label>
                    <input type="text" id="login-username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="login-password" required autocomplete="off">
                </div>
                <button type="submit" class="btn-primary">Log In</button>
                <div class="auth-toggle">
                    Need an account? <span id="show-signup">Register</span>
                </div>
            </form>
        </div>

        <div class="login-card hidden" id="signup-box">
            <h1>Create an account</h1>
            <form id="signup-form">
                <div class="input-group">
                    <label>USERNAME</label>
                    <input type="text" id="signup-username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="signup-password" required autocomplete="off">
                </div>
                <button type="submit" class="btn-primary">Continue</button>
                <div class="auth-toggle">
                    Already have an account? <span id="show-login">Log In</span>
                </div>
            </form>
        </div>

        <!-- Room Dashboard (Post-Auth) -->
        <div class="login-card hidden" id="room-dashboard-box">
            <h1>Room Dashboard</h1>
            <p>Select a room to join or create your own!</p>
            
            <div id="room-list-container" class="room-grid">
                <!-- Rooms populate here -->
            </div>

            <div class="dashboard-actions">
                <button id="show-create-room" class="btn-secondary">Create New Room</button>
            </div>
        </div>

        <!-- Create Room Modal/Box -->
        <div class="login-card hidden" id="create-room-box">
            <h1>Create Room</h1>
            <form id="create-room-form">
                <div class="input-group">
                    <label>ROOM NAME</label>
                    <input type="text" id="new-room-name" required placeholder="Enter room name...">
                </div>
                <div class="input-group">
                    <label>DESCRIPTION</label>
                    <input type="text" id="new-room-desc" required placeholder="What is this room about?">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Create</button>
                    <button type="button" id="cancel-create-room" class="btn-ghost">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main Interface -->
    <div id="app-container" class="app-container hidden">
        <!-- Left Sidebar: Static Channels -->
        <nav class="server-sidebar">
            <div class="sidebar-top-icon" id="goto-dashboard" title="Back to Dashboard">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </div>
            <div class="divider"></div>
            <div id="active-rooms-sidebar">
                <!-- Joined rooms show up here -->
            </div>
            <div class="divider"></div>
            <div class="server-icon add-server" id="sidebar-add-room" title="Quick Join/Create">+</div>
        </nav>

        <!-- Main Chat Content -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="room-info">
                    <span class="room-indicator">#</span>
                    <h3 id="chat-header-name">General</h3>
                </div>
                <div class="header-actions">
                    <button class="header-btn" title="Thread"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></button>
                    <button class="header-btn" title="Bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></button>
                    <button class="header-btn" id="toggle-users" title="Member List"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></button>
                </div>
            </header>
            
            <div class="chat-messages" id="chat-messages">
                <!-- Messages populate here -->
            </div>

            <footer class="chat-input-area">
                <div class="input-wrapper">
                    <form id="chat-form-main">
                        <input type="text" id="msg" placeholder="Message..." required autocomplete="off">
                    </form>
                    <div class="input-features">
                        <button class="feature-btn" id="emoji-btn" title="Emoji">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                        </button>
                    </div>
                </div>
                
                <!-- Floating Trays -->
                <div id="emoji-tray" class="floating-tray hidden">
                    <span>😀</span><span>😂</span><span>😍</span><span>🤔</span><span>👍</span><span>🔥</span><span>✨</span><span>🎉</span>
                </div>
            </footer>
        </main>

        <!-- Right Sidebar: Users -->
        <aside class="user-sidebar" id="user-sidebar">
            <div class="category">
                <span class="category-header">MEMBERS — <span id="online-count">0</span></span>
                <ul id="users-list" class="user-list">
                    <!-- Users go here -->
                </ul>
            </div>
            <footer class="user-footer">
                <div class="current-user-info">
                    <div class="avatar" id="current-avatar">U</div>
                    <div class="details">
                        <span id="current-username" class="un">Username</span>
                        <span class="st">Online</span>
                    </div>
                </div>
                <button id="leave-btn" class="logout-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </footer>
        </aside>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
